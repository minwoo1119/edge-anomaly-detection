# Flat YAML keeps the Jetson runtime free of a YAML library dependency.
engine_path: models/patchcore_feature_extractor_fp32.engine
memory_bank_path: models/patchcore_memory_bank.npy
category: bottle
model: patchcore_wide_resnet50_2
precision: fp32
bank_precision: fp32
nn_backend: cpu
input_width: 256
input_height: 256
threshold: 0.5
coreset_ratio: 0.10
num_neighbors: 9
gaussian_sigma: 4.0
warmup: 50
repeats: 200
